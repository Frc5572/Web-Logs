      #       echo "========================================"

      #       git apply \
      #         --check \
      #         "$patch"

      #       git apply \
      #         --verbose \
      #         "$patch"
      #     done

      # - name: Show patched revision
      #   working-directory: advantagescope
      #   shell: bash
      #   run: |
      #     git status --short
      #     git diff --stat
      # - name: Configure Google Drive
      #   working-directory: advantagescope
      #   env:
      #     GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      #     GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
      #     GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
      #   run: |
      #     python3 - <<'PY'
      #     from pathlib import Path
      #     import os

      #     path = Path("src/main/lite/main.ts")
      #     text = path.read_text()

      #     replacements = {
