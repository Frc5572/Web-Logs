      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: advantagescope/package-lock.json

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version
          emcc --version

      - name: Install dependencies
        working-directory: advantagescope
        env:
          ASCOPE_DISTRIBUTION: LITE
        run: npm ci

      - name: Compile AdvantageScope
        working-directory: advantagescope
        env:
          ASCOPE_DISTRIBUTION: LITE
        run: npm run compile

      - name: Compile WebAssembly
        working-directory: advantagescope
        env:
          ASCOPE_DISTRIBUTION: LITE
        run: npm run wasm:compile

      - name: Build embedded documentation
        working-directory: advantagescope
        env:
          ASCOPE_DISTRIBUTION: LITE
        run: npm run docs:build-embed

      - name: Create Deployment Package
        shell: bash
        run: node scripts/build-manifest.mjs

      - name: Upload Deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-data  # Unique name for the artifact
          path: ./worker-assets/  # File or directory path to upload

  deploy:
    name: Deploy
    # if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment assets
        uses: actions/download-artifact@v4
        with:
          name: worker-data
          path: worker-assets/   # Extracted contents will go here
      # Step 1: Deploy Preview for Pull Requests
      - name: Deploy Preview to Cloudflare
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The command flag creates a preview deployment tied to the PR lifecycle
          workingDirectory: ./worker-assets
          command: preview --name pr-${{ github.event.number || github.ref_name }}

      # Step 2: Deploy to Production for pushes to Main
      - name: Deploy Production to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./worker-assets
          # Standard deploy command pushes directly to production
          command: deploy

