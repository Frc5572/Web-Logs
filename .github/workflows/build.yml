      #     python3 - <<'PY'
      #     from pathlib import Path
      #     import os

      #     path = Path("src/main/lite/main.ts")
      #     text = path.read_text()

      #     replacements = {
      #         "__GOOGLE_CLIENT_ID__": os.environ["GOOGLE_CLIENT_ID"],
