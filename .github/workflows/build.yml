      #       echo "========================================"

      #       git apply \
      #         --check \
      #         "$patch"

      #       git apply \
      #         --verbose \
      #         "$patch"
      #     done

      # - name: Show patched revision
      #   working-directory: advantagescope
      #   shell: bash
