name: Build AdvantageScope Lite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  EMSCRIPTEN_VERSION: "4.0.12"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v6

      - name: Read upstream version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          source upstream/advantagescope.env

          echo "repo=${ADVANTAGESCOPE_REPO}" >> "$GITHUB_OUTPUT"
          echo "ref=${ADVANTAGESCOPE_REF}" >> "$GITHUB_OUTPUT"

          echo "Using AdvantageScope:"
          echo "  Repository: ${ADVANTAGESCOPE_REPO}"
          echo "  Commit:     ${ADVANTAGESCOPE_REF}"

      - name: Validate upstream commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${{ steps.upstream.outputs.ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ADVANTAGESCOPE_REF must be a 40-character commit SHA"
            exit 1
          fi

      - name: Clone AdvantageScope
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --no-checkout \
            "${{ steps.upstream.outputs.repo }}" \
            advantagescope

          cd advantagescope

          git fetch \
            --depth=1 \
            origin \
            "${{ steps.upstream.outputs.ref }}"

          git checkout \
            --detach \
            "${{ steps.upstream.outputs.ref }}"

      - name: Verify upstream commit
        working-directory: advantagescope
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ steps.upstream.outputs.ref }}"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Checked out commit does not match requested commit"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

      # - name: Apply AdvantageScope patches
