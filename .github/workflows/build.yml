      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: advantagescope/package-lock.json

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version
          emcc --version

      - name: Install dependencies
        working-directory: advantagescope
        env:
          ASCOPE_DISTRIBUTION: LITE
        run: npm ci

      - name: Compile AdvantageScope
        working-directory: advantagescope
        env:
          ASCOPE_DISTRIBUTION: LITE
        run: npm run compile

      - name: Compile WebAssembly
        working-directory: advantagescope
        env:
          ASCOPE_DISTRIBUTION: LITE
        run: npm run wasm:compile

      - name: Build embedded documentation
        working-directory: advantagescope
        env:
          ASCOPE_DISTRIBUTION: LITE
        run: npm run docs:build-embed

      - name: Verify Lite output
        working-directory: advantagescope
        shell: bash
        run: |
          set -euo pipefail

          test -d lite/static
          test -f lite/static/bundles/main.js
          test -f lite/static/bundles/hub.js
          test -f lite/static/bundles/wpilogWorker.js
          test -f lite/static/bundles/wpilogIndexer.js
          test -f lite/static/bundles/wpilogIndexer.wasm

          echo "Lite output:"
          find lite/static -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        # if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        # if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: advantagescope/lite/static

  deploy:
    name: Deploy
    # if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4